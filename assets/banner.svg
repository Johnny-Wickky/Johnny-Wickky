<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Johnny Wickky — 1NF0S3C, SOC, OS1NT, AI">
  <defs>
    <!-- Deep Outrun Night Sky -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05030d"/>
      <stop offset="40%" stop-color="#0d0824"/>
      <stop offset="68%" stop-color="#1f0d3d"/>
      <stop offset="100%" stop-color="#3b1254"/>
    </linearGradient>

    <!-- Horizon Neon Haze -->
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e040fb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e040fb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38e8ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Warm Retro Sun -->
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe57f"/>
      <stop offset="35%" stop-color="#ff9e44"/>
      <stop offset="70%" stop-color="#f23b78"/>
      <stop offset="100%" stop-color="#9c27b0"/>
    </linearGradient>

    <!-- Sun Outer Aura -->
    <radialGradient id="sunAura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f23b78" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#9c27b0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0d0824" stop-opacity="0"/>
    </radialGradient>

    <!-- Ground Floor -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14072b"/>
      <stop offset="35%" stop-color="#0a0417"/>
      <stop offset="100%" stop-color="#04020a"/>
    </linearGradient>

    <!-- Perspective Grid Lines -->
    <linearGradient id="gridV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38e8ff" stop-opacity="0.75"/>
      <stop offset="30%" stop-color="#d946ef" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Chrome / Neon Title Fill -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#ccf7ff"/>
      <stop offset="52%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>

    <!-- Soft Real Neon Glow Filters -->
    <filter id="neonPink" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b1"/>
      <feGaussianBlur stdDeviation="8" result="b2"/>
      <feGaussianBlur stdDeviation="18" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neonCyan" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outrun Sun Scanline Cutouts -->
    <mask id="sunMask">
      <rect x="0" y="0" width="1200" height="232" fill="#fff"/>
      <rect x="440" y="152" width="320" height="3" fill="#000"/>
      <rect x="440" y="164" width="320" height="4.5" fill="#000"/>
      <rect x="440" y="177" width="320" height="6" fill="#000"/>
      <rect x="440" y="191" width="320" height="8" fill="#000"/>
      <rect x="440" y="206" width="320" height="10" fill="#000"/>
      <rect x="440" y="222" width="320" height="12" fill="#000"/>
    </mask>

    <clipPath id="aboveHorizon">
      <rect x="0" y="0" width="1200" height="232"/>
    </clipPath>

    <clipPath id="belowHorizon">
      <rect x="0" y="232" width="1200" height="128"/>
    </clipPath>
  </defs>

  <style>
    .star { animation: twinkle 4.5s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.95; } }
    .cursor { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
    .sunPulse { animation: sunP 6s ease-in-out infinite; transform-origin: 600px 190px; }
    @keyframes sunP { 0%, 100% { opacity: 0.92; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Sky Background -->
  <rect width="1200" height="360" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#e2e8f0">
    <circle class="star" cx="75" cy="38" r="1.1" style="animation-delay:0.2s"/>
    <circle class="star" cx="155" cy="68" r="1.4" style="animation-delay:1.5s"/>
    <circle class="star" cx="240" cy="28" r="0.9" style="animation-delay:2.7s"/>
    <circle class="star" cx="330" cy="54" r="1.3" style="animation-delay:0.8s"/>
    <circle class="star" cx="425" cy="32" r="1.0" style="animation-delay:3.1s"/>
    <circle class="star" cx="515" cy="48" r="1.2" style="animation-delay:1.9s"/>
    <circle class="star" cx="695" cy="42" r="1.2" style="animation-delay:0.4s"/>
    <circle class="star" cx="780" cy="26" r="1.5" style="animation-delay:2.2s"/>
    <circle class="star" cx="875" cy="62" r="1.0" style="animation-delay:3.6s"/>
    <circle class="star" cx="960" cy="35" r="1.3" style="animation-delay:1.1s"/>
    <circle class="star" cx="1055" cy="70" r="1.1" style="animation-delay:2.9s"/>
    <circle class="star" cx="1135" cy="40" r="1.4" style="animation-delay:0.7s"/>
    <circle class="star" cx="110" cy="115" r="0.9" style="animation-delay:2.0s"/>
    <circle class="star" cx="1090" cy="118" r="1.0" style="animation-delay:1.4s"/>
  </g>

  <!-- Retro Sun & Aura -->
  <circle cx="600" cy="185" r="220" fill="url(#sunAura)"/>
  <g mask="url(#sunMask)" class="sunPulse">
    <circle cx="600" cy="182" r="108" fill="url(#sunGrad)"/>
  </g>

  <!-- Distant Wireframe Mountain Silhouette -->
  <g clip-path="url(#aboveHorizon)">
    <polygon points="0,232 0,204 85,178 165,208 260,164 355,212 435,192 505,232" fill="#0b051b" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1.2"/>
    <polygon points="695,232 765,194 845,214 940,162 1035,206 1115,176 1200,202 1200,232" fill="#0b051b" stroke="#38e8ff" stroke-opacity="0.4" stroke-width="1.2"/>
  </g>

  <!-- Horizon Haze -->
  <rect x="0" y="206" width="1200" height="52" fill="url(#haze)"/>

  <!-- Ground & Perspective Neon Grid -->
  <rect x="0" y="232" width="1200" height="128" fill="url(#floor)"/>
  <g clip-path="url(#belowHorizon)">
    <!-- Radial perspective lines from (600, 232) -->
    <g stroke="url(#gridV)" stroke-width="1.25">
      <line x1="600" y1="232" x2="-480" y2="360"/>
      <line x1="600" y1="232" x2="-300" y2="360"/>
      <line x1="600" y1="232" x2="-120" y2="360"/>
      <line x1="600" y1="232" x2="60" y2="360"/>
      <line x1="600" y1="232" x2="210" y2="360"/>
      <line x1="600" y1="232" x2="340" y2="360"/>
      <line x1="600" y1="232" x2="470" y2="360"/>
      <line x1="600" y1="232" x2="600" y2="360"/>
      <line x1="600" y1="232" x2="730" y2="360"/>
      <line x1="600" y1="232" x2="860" y2="360"/>
      <line x1="600" y1="232" x2="990" y2="360"/>
      <line x1="600" y1="232" x2="1140" y2="360"/>
      <line x1="600" y1="232" x2="1320" y2="360"/>
      <line x1="600" y1="232" x2="1500" y2="360"/>
      <line x1="600" y1="232" x2="1680" y2="360"/>
    </g>
    <!-- Horizontal depth lines -->
    <g stroke="#d946ef" fill="none">
      <line x1="0" y1="237" x2="1200" y2="237" stroke-opacity="0.55" stroke-width="1"/>
      <line x1="0" y1="245" x2="1200" y2="245" stroke-opacity="0.5" stroke-width="1"/>
      <line x1="0" y1="256" x2="1200" y2="256" stroke-opacity="0.45" stroke-width="1.1"/>
      <line x1="0" y1="271" x2="1200" y2="271" stroke-opacity="0.4" stroke-width="1.2"/>
      <line x1="0" y1="291" x2="1200" y2="291" stroke-opacity="0.35" stroke-width="1.3"/>
      <line x1="0" y1="318" x2="1200" y2="318" stroke-opacity="0.3" stroke-width="1.4"/>
      <line x1="0" y1="352" x2="1200" y2="352" stroke-opacity="0.25" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Glowing Horizon Laser Line -->
  <line x1="0" y1="232" x2="1200" y2="232" stroke="#38e8ff" stroke-width="2" filter="url(#neonCyan)"/>

  <!-- HUD Corner Accents -->
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="11" fill="#38e8ff" opacity="0.7" letter-spacing="2">
    <text x="36" y="32">SYS.NODE // JW-1337</text>
    <text x="1164" y="32" text-anchor="end">SIGNAL: ENCRYPTED</text>
  </g>

  <!-- Main Neon Title with Layered Glow -->
  <g font-family="'Segoe UI', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="74" font-style="italic" letter-spacing="6" text-anchor="middle">
    <!-- Deep Magenta Neon Aura -->
    <text x="603" y="118" fill="#f72585" opacity="0.85" filter="url(#neonPink)">JOHNNY WICKKY</text>
    <!-- Cyan Chromatic Shift -->
    <text x="597" y="114" fill="#38e8ff" opacity="0.75">JOHNNY WICKKY</text>
    <!-- Crisp Chrome Core -->
    <text x="600" y="116" fill="url(#chrome)">JOHNNY WICKKY</text>
  </g>

  <!-- Subtitle Pill on the Grid -->
  <rect x="310" y="258" width="580" height="36" rx="18" fill="#070412" fill-opacity="0.82" stroke="#38e8ff" stroke-opacity="0.55" stroke-width="1.2" filter="url(#neonCyan)"/>
  <text x="600" y="281" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="15.5" font-weight="700" fill="#e0f2fe" letter-spacing="4">
    // <tspan fill="#38e8ff">1NF0S3C</tspan> · <tspan fill="#f472b6">S0C</tspan> · <tspan fill="#38e8ff">0S1NT</tspan> · <tspan fill="#c084fc">4I</tspan> //<tspan class="cursor" fill="#38e8ff">_</tspan>
  </text>

  <!-- Bottom Tagline -->
  <text x="600" y="328" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#cbd5e1" letter-spacing="2.5" opacity="0.9">
    ИЩУ СИГНАЛ В ШУМЕ СЕТИ  ·  СТРОЮ ЗАЩИТУ, КОТОРОЙ НЕ НУЖНО ВЕРИТЬ НА СЛОВО
  </text>
</svg>
