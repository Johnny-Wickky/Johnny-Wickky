<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="920" height="270" role="img" aria-label="1337 terminal output">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0719"/>
      <stop offset="55%" stop-color="#090b16"/>
      <stop offset="100%" stop-color="#110922"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38e8ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="softGlow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .cur { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Outer Window Frame -->
  <rect x="2" y="2" width="916" height="266" rx="10" fill="url(#termBg)" stroke="url(#borderGlow)" stroke-width="1.5"/>

  <!-- Top Bar -->
  <path d="M 3 12 Q 3 3 12 3 L 908 3 Q 917 3 917 12 L 917 36 L 3 36 Z" fill="#150d2a"/>
  <line x1="3" y1="36" x2="917" y2="36" stroke="#2e1d52" stroke-width="1"/>

  <!-- Window Controls (Soft Neon) -->
  <circle cx="22" cy="19.5" r="5.5" fill="#f43f5e" opacity="0.85"/>
  <circle cx="40" cy="19.5" r="5.5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="58" cy="19.5" r="5.5" fill="#10b981" opacity="0.85"/>

  <!-- Window Title -->
