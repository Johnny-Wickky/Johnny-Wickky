  <!-- 13. SIEM / SOAR (x=87) -->
  <g transform="translate(87, 68)">
    <rect class="t c" width="70" height="54"/>
    <circle cx="35" cy="21" r="11" fill="none" stroke="#38e8ff" stroke-width="1.5"/>
    <circle cx="35" cy="21" r="6" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="3 2"/>
    <line x1="35" y1="21" x2="43" y2="14" stroke="#f472b6" stroke-width="2" filter="url(#glow)"/>
    <circle cx="35" cy="21" r="2" fill="#38e8ff"/>
    <text class="lbl" x="35" y="47">SIEM / SOAR</text>
  </g>

  <!-- 14. NGFW / ViPNet (x=166) -->
  <g transform="translate(166, 68)">
    <rect class="t p" width="70" height="54"/>
    <path d="M35 9 L47 14 V22 C47 29 41 33 35 35 C29 33 23 29 23 22 V14 Z" fill="none" stroke="#38e8ff" stroke-width="1.8" filter="url(#glow)"/>
    <rect x="31.5" y="20" width="7" height="6" rx="1" fill="#f472b6"/>
    <path d="M33 20 v-2.5 a2 2 0 0 1 4 0 v2.5" fill="none" stroke="#f472b6" stroke-width="1.5"/>
    <text class="lbl" x="35" y="47">NGFW · VIPNET</text>
  </g>

  <!-- 15. DLP / EDR (x=245) -->
  <g transform="translate(245, 68)">
    <rect class="t c" width="70" height="54"/>
    <polyline points="20,22 27,22 30,13 35,30 39,18 42,22 50,22" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <text class="lbl" x="35" y="47">DLP / EDR</text>
  </g>

