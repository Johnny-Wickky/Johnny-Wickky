  <!-- 22. PyTorch / AI (x=798) -->
  <g transform="translate(798, 68)">
    <rect class="t c" width="70" height="54"/>
    <path d="M39 12 A9 9 0 1 0 43 24" fill="none" stroke="#f97316" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="39" cy="12" r="2.2" fill="#facc15" filter="url(#glow)"/>
