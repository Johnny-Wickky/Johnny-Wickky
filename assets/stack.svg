<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" width="880" height="128" role="img" aria-label="Tech Stack and Security Arsenal Icons">
  <defs>
    <!-- Tile background & neon borders -->
    <linearGradient id="tileBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#130d26"/>
      <stop offset="100%" stop-color="#0b0816"/>
    </linearGradient>
    <linearGradient id="bCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38e8ff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="bPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38e8ff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .t { fill: url(#tileBg); stroke-width: 1.2; rx: 11px; }
    .c { stroke: url(#bCyan); }
    .p { stroke: url(#bPink); }
    .lbl { font-family: Consolas, 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 700; fill: #94a3b8; text-anchor: middle; letter-spacing: 0.4px; }
  </style>

  <!-- ==================== ROW 1 (11 tiles, x = 8 + i*79, y = 4) ==================== -->

  <!-- 1. Rust (x=8) -->
  <g transform="translate(8, 4)">
    <rect class="t c" width="70" height="54"/>
    <circle cx="35" cy="21" r="11" fill="none" stroke="#f97316" stroke-width="2.4" stroke-dasharray="4 2"/>
    <text x="35" y="25" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="13" fill="#ffedd5">R</text>
    <text class="lbl" x="35" y="47">RUST</text>
  </g>

  <!-- 2. Python (x=87) -->
  <g transform="translate(87, 4)">
    <rect class="t c" width="70" height="54"/>
    <path d="M29 14 h10 a4 4 0 0 1 4 4 v4 a3 3 0 0 1 -3 3 h-10 a3 3 0 0 0 -3 3 v2 h-3 a3 3 0 0 1 -3 -3 v-7 a4 4 0 0 1 4 -4 z" fill="#38bdf8"/>
    <path d="M41 30 h-10 a4 4 0 0 1 -4 -4 v-4 a3 3 0 0 1 3 -3 h10 a3 3 0 0 0 3 -3 v-2 h3 a3 3 0 0 1 3 3 v7 a4 4 0 0 1 -4 4 z" fill="#facc15"/>
    <text class="lbl" x="35" y="47">PYTHON</text>
  </g>

  <!-- 3. C# (x=166) -->
  <g transform="translate(166, 4)">
    <rect class="t p" width="70" height="54"/>
    <polygon points="35,9 47,16 47,29 35,36 23,29 23,16" fill="#7e22ce" stroke="#c084fc" stroke-width="1.2"/>
    <text x="35" y="27" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="12.5" fill="#ffffff">C#</text>
    <text class="lbl" x="35" y="47">C SHARP</text>
  </g>

  <!-- 4. Unity (x=245) -->
  <g transform="translate(245, 4)">
    <rect class="t c" width="70" height="54"/>
    <g fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round">
      <polygon points="35,9 46,15 46,28 35,34 24,28 24,15"/>
      <polyline points="24,15 35,21 46,15"/>
      <line x1="35" y1="21" x2="35" y2="34"/>
    </g>
    <text class="lbl" x="35" y="47">UNITY</text>
  </g>

  <!-- 5. TypeScript (x=324) -->
  <g transform="translate(324, 4)">
    <rect class="t c" width="70" height="54"/>
    <rect x="23" y="10" width="24" height="24" rx="4" fill="#2563eb"/>
    <text x="35" y="28" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="12.5" fill="#ffffff">TS</text>
    <text class="lbl" x="35" y="47">TYPESCRIPT</text>
  </g>

  <!-- 6. Linux (x=403) -->
  <g transform="translate(403, 4)">
    <rect class="t p" width="70" height="54"/>
    <rect x="22" y="10" width="26" height="23" rx="4" fill="#0f172a" stroke="#38e8ff" stroke-width="1.4"/>
    <text x="35" y="25" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="11.5" fill="#38e8ff">&gt;_</text>
    <text class="lbl" x="35" y="47">LINUX</text>
  </g>

  <!-- 7. Astra Linux (x=482) -->
  <g transform="translate(482, 4)">
    <rect class="t p" width="70" height="54"/>
    <polygon points="35,9 38,18 47,18 40,23 43,32 35,27 27,32 30,23 23,18 32,18" fill="none" stroke="#f43f5e" stroke-width="1.8" filter="url(#glow)"/>
    <circle cx="35" cy="22" r="2.2" fill="#38e8ff"/>
    <text class="lbl" x="35" y="47">ASTRA LINUX</text>
  </g>

  <!-- 8. Windows (x=561) -->
  <g transform="translate(561, 4)">
    <rect class="t c" width="70" height="54"/>
    <g fill="#0ea5e9">
      <rect x="24" y="10" width="10" height="10" rx="1.5"/>
      <rect x="36" y="10" width="10" height="10" rx="1.5"/>
      <rect x="24" y="22" width="10" height="10" rx="1.5"/>
      <rect x="36" y="22" width="10" height="10" rx="1.5"/>
    </g>
    <text class="lbl" x="35" y="47">WINDOWS</text>
  </g>

