  <g transform="translate(324, 68)">
    <rect class="t c" width="70" height="54"/>
    <circle cx="35" cy="21" r="11" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M29 26 C30 19 34 15 42 13 C38 17 37 21 41 25 C36 24 33 26 29 28 Z" fill="#38e8ff" filter="url(#glow)"/>
    <text class="lbl" x="35" y="47">KALI LINUX</text>
  </g>

  <!-- 17. Nmap (x=403) -->
  <g transform="translate(403, 68)">
    <rect class="t p" width="70" height="54"/>
    <path d="M21 21 Q35 10 49 21 Q35 32 21 21 Z" fill="none" stroke="#38e8ff" stroke-width="1.7"/>
    <circle cx="35" cy="21" r="4.5" fill="none" stroke="#f472b6" stroke-width="1.6"/>
    <circle cx="35" cy="21" r="1.8" fill="#38e8ff"/>
    <text class="lbl" x="35" y="47">NMAP</text>
  </g>

  <!-- 18. Burp Suite (x=482) -->
  <g transform="translate(482, 68)">
    <rect class="t p" width="70" height="54"/>
    <rect x="23" y="10" width="24" height="23" rx="4" fill="none" stroke="#fb923c" stroke-width="1.7"/>
    <polyline points="36,12 31,21 36,21 33,30 40,20 35,20" fill="#fb923c" filter="url(#glow)"/>
    <text class="lbl" x="35" y="47">BURP SUITE</text>
  </g>

  <!-- 19. Metasploit (x=561) -->
  <g transform="translate(561, 68)">
    <rect class="t c" width="70" height="54"/>
    <path d="M24 11 L35 9 L46 11 V24 C46 30 35 34 35 34 C35 34 24 30 24 24 Z" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.4"/>
    <text x="35" y="26" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff">M</text>
    <text class="lbl" x="35" y="47">METASPLOIT</text>
  </g>

  <!-- 20. Wireshark (x=640) -->
  <g transform="translate(640, 68)">
    <rect class="t c" width="70" height="54"/>
    <path d="M21 29 H49 M26 29 C28 19 34 13 42 12 C39 18 39 24 42 29 Z" fill="#0ea5e9" stroke="#38e8ff" stroke-width="1.5" stroke-linejoin="round"/>
    <text class="lbl" x="35" y="47">WIRESHARK</text>
  </g>

  <!-- 21. WebAssembly (x=719) -->
  <g transform="translate(719, 68)">
    <rect class="t p" width="70" height="54"/>
    <path d="M23 10 h9 a3 3 0 0 0 6 0 h9 v23 h-24 z" fill="#6d28d9" stroke="#a855f7" stroke-width="1.2"/>
    <text x="35" y="28" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="10.5" fill="#ffffff">WA</text>
    <text class="lbl" x="35" y="47">WASM</text>
