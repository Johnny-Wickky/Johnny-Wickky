  <g transform="translate(640, 4)">
    <rect class="t c" width="70" height="54"/>
    <g fill="none" stroke="#38bdf8" stroke-width="1.6">
      <rect x="22" y="10" width="26" height="6.5" rx="1.5"/>
      <rect x="22" y="18.5" width="26" height="6.5" rx="1.5"/>
      <rect x="22" y="27" width="26" height="6.5" rx="1.5"/>
    </g>
    <g fill="#f472b6">
      <circle cx="26" cy="13.2" r="1.3"/>
      <circle cx="26" cy="21.7" r="1.3"/>
      <circle cx="26" cy="30.2" r="1.3"/>
    </g>
    <text class="lbl" x="35" y="47">WIN SERVER</text>
  </g>

  <!-- 10. Active Directory (x=719) -->
  <g transform="translate(719, 4)">
    <rect class="t p" width="70" height="54"/>
    <g stroke="#38e8ff" stroke-width="1.6" fill="#0f172a">
      <line x1="35" y1="15" x2="25" y2="28"/>
      <line x1="35" y1="15" x2="45" y2="28"/>
      <line x1="25" y1="28" x2="45" y2="28" stroke-opacity="0.4"/>
      <circle cx="35" cy="13" r="4" fill="#a855f7" stroke="#e9d5ff"/>
      <circle cx="25" cy="29" r="3.5" fill="#38e8ff"/>
      <circle cx="45" cy="29" r="3.5" fill="#38e8ff"/>
    </g>
    <text class="lbl" x="35" y="47">ACTIVE DIR</text>
  </g>

  <!-- 11. Docker (x=798) -->
  <g transform="translate(798, 4)">
    <rect class="t c" width="70" height="54"/>
    <g fill="#38bdf8">
      <rect x="25" y="17" width="4.5" height="4.5" rx="0.8"/>
      <rect x="30.5" y="17" width="4.5" height="4.5" rx="0.8"/>
      <rect x="36" y="17" width="4.5" height="4.5" rx="0.8"/>
      <rect x="30.5" y="11.5" width="4.5" height="4.5" rx="0.8"/>
      <rect x="36" y="11.5" width="4.5" height="4.5" rx="0.8"/>
      <path d="M21 23 h24 c2 0 4 -1.5 5 -3 c1 2 0 6 -2 7 c-2 4 -7 6 -14 6 c-7 0 -12 -3 -13 -10 z"/>
    </g>
    <text class="lbl" x="35" y="47">DOCKER</text>
  </g>

  <!-- ==================== ROW 2 (11 tiles, x = 8 + i*79, y = 68) ==================== -->

  <!-- 12. ELK Stack (x=8) -->
  <g transform="translate(8, 68)">
    <rect class="t p" width="70" height="54"/>
    <path d="M24 14 h22 a3 3 0 0 1 0 5 h-22 a3 3 0 0 1 0 -5 z" fill="#facc15"/>
    <path d="M24 20.5 h18 a3 3 0 0 1 0 5 h-18 a3 3 0 0 1 0 -5 z" fill="#38e8ff"/>
    <path d="M24 27 h22 a3 3 0 0 1 0 5 h-22 a3 3 0 0 1 0 -5 z" fill="#f472b6"/>
    <text class="lbl" x="35" y="47">ELK STACK</text>
